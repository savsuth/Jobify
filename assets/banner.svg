<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Jobify — a multi-agent job application system built with LangGraph and Claude">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="55%" stop-color="#030302"/>
      <stop offset="100%" stop-color="#070503"/>
    </linearGradient>
    <radialGradient id="glow" cx="16%" cy="46%" r="72%">
      <stop offset="0%" stop-color="#a85f3d" stop-opacity="0.10"/>
      <stop offset="45%" stop-color="#a85f3d" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#a85f3d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grain" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.1" fill="#ffffff" opacity="0.04"/>
    </pattern>
    <linearGradient id="wordmark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3efe9"/>
      <stop offset="100%" stop-color="#cbc0b2"/>
    </linearGradient>
    <linearGradient id="underline" x1="-40%" y1="0%" x2="60%" y2="0%">
      <stop offset="0%" stop-color="#a85f3d" stop-opacity="0"/>
      <stop offset="50%" stop-color="#c98f6c" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a85f3d" stop-opacity="0"/>
      <animate attributeName="x1" values="-40%;140%" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="60%;240%" dur="3.4s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="divider" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#332c25" stop-opacity="0"/>
      <stop offset="50%" stop-color="#403830" stop-opacity="1"/>
      <stop offset="100%" stop-color="#332c25" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="seg1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a6ba8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#bd7350" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="seg2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bd7350" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8071a8" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="seg3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8071a8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#33a67c" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="footerThread" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#35548f"/>
      <stop offset="33%" stop-color="#a85f3d"/>
      <stop offset="66%" stop-color="#6b5b95"/>
      <stop offset="100%" stop-color="#1f8a63"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>
  <rect width="1280" height="320" fill="url(#grain)"/>

  <text x="63" y="151" font-family="'Inter','SF Pro Display','Segoe UI',system-ui,Helvetica,Arial,sans-serif" font-size="84" font-weight="800" letter-spacing="-3" fill="url(#wordmark)">Jobify</text>

  <rect x="66" y="170" width="118" height="2.5" rx="1.25" fill="url(#underline)"/>

  <text x="66" y="207" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#ab9f92">Discovery, filtering, and resume tailoring &#8212;</text>
  <text x="66" y="232" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#ab9f92">Built with Claude and Neon.</text>

  <rect x="741" y="54" width="1" height="212" fill="url(#divider)"/>

  <g stroke-width="1.5" fill="none">
    <line x1="834" y1="160" x2="896" y2="160" stroke="url(#seg1)"/>
    <line x1="834" y1="160" x2="896" y2="160" stroke="#c2ab97" stroke-dasharray="2 10" stroke-linecap="round" stroke-opacity="0.7">
      <animate attributeName="stroke-dashoffset" values="12;0" dur="1s" repeatCount="indefinite"/>
    </line>
    <line x1="964" y1="160" x2="1026" y2="160" stroke="url(#seg2)"/>
    <line x1="964" y1="160" x2="1026" y2="160" stroke="#c2ab97" stroke-dasharray="2 10" stroke-linecap="round" stroke-opacity="0.7">
      <animate attributeName="stroke-dashoffset" values="12;0" dur="1s" begin="0.33s" repeatCount="indefinite"/>
    </line>
    <line x1="1094" y1="160" x2="1156" y2="160" stroke="url(#seg3)"/>
    <line x1="1094" y1="160" x2="1156" y2="160" stroke="#c2ab97" stroke-dasharray="2 10" stroke-linecap="round" stroke-opacity="0.7">
      <animate attributeName="stroke-dashoffset" values="12;0" dur="1s" begin="0.66s" repeatCount="indefinite"/>
    </line>
  </g>

  <g font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">
    <g>
      <circle cx="800" cy="160" r="40" fill="#35548f" opacity="0.05"/>
      <circle cx="800" cy="160" r="30" fill="#35548f" opacity="0.11">
        <animate attributeName="opacity" values="0.06;0.15;0.06" dur="4s" begin="0s" repeatCount="indefinite"/>
      </circle>
      <circle cx="800" cy="160" r="24" fill="#020202" stroke="#4a6ba8" stroke-width="1.5"/>
      <text x="800" y="165" font-weight="700" fill="#a89b8c" font-size="12.5">DISC</text>
    </g>
    <g>
      <circle cx="930" cy="160" r="40" fill="#a85f3d" opacity="0.05"/>
      <circle cx="930" cy="160" r="30" fill="#a85f3d" opacity="0.11">
        <animate attributeName="opacity" values="0.06;0.15;0.06" dur="4s" begin="0.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="930" cy="160" r="24" fill="#020202" stroke="#bd7350" stroke-width="1.5"/>
      <text x="930" y="165" font-weight="700" fill="#a89b8c" font-size="13">ATS</text>
    </g>
    <g>
      <circle cx="1060" cy="160" r="40" fill="#6b5b95" opacity="0.05"/>
      <circle cx="1060" cy="160" r="30" fill="#6b5b95" opacity="0.11">
        <animate attributeName="opacity" values="0.06;0.15;0.06" dur="4s" begin="1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1060" cy="160" r="24" fill="#020202" stroke="#8071a8" stroke-width="1.5"/>
      <text x="1060" y="165" font-weight="700" fill="#a89b8c" font-size="13">RES</text>
    </g>
    <g>
      <circle cx="1190" cy="160" r="40" fill="#1f8a63" opacity="0.05"/>
      <circle cx="1190" cy="160" r="30" fill="#1f8a63" opacity="0.11">
        <animate attributeName="opacity" values="0.06;0.15;0.06" dur="4s" begin="1.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1190" cy="160" r="24" fill="#020202" stroke="#33a67c" stroke-width="1.5"/>
      <text x="1190" y="165" font-weight="700" fill="#a89b8c" font-size="13">OUT</text>
    </g>

    <text x="800" y="213" font-family="'SF Mono','JetBrains Mono',Consolas,monospace" font-size="11" letter-spacing="1.6" fill="#8a7d70">DISCOVER</text>
    <text x="930" y="213" font-family="'SF Mono','JetBrains Mono',Consolas,monospace" font-size="11" letter-spacing="1.6" fill="#8a7d70">EVALUATE</text>
    <text x="1060" y="213" font-family="'SF Mono','JetBrains Mono',Consolas,monospace" font-size="11" letter-spacing="1.6" fill="#8a7d70">TAILOR</text>
    <text x="1190" y="213" font-family="'SF Mono','JetBrains Mono',Consolas,monospace" font-size="11" letter-spacing="1.6" fill="#8a7d70">DELIVER</text>
  </g>

  <rect x="0" y="317" width="1280" height="2" fill="url(#footerThread)" opacity="0.55"/>
</svg>
