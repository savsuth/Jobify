<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Jobify — a multi-agent job application system built with LangGraph and Claude">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e13"/>
      <stop offset="100%" stop-color="#161d26"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#ffffff" opacity="0.05"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5560"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="320" fill="url(#bg)"/>
  <rect x="0" y="0" width="1280" height="320" fill="url(#dots)"/>

  <text x="64" y="152" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="80" font-weight="800" fill="#f5f7fa">Jobify</text>

  <text x="66" y="196" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#9aa4af">Discovers live postings, evaluates candidate fit, and</text>
  <text x="66" y="223" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#9aa4af">tailors resumes — built with LangGraph and Claude.</text>

  <line x1="742" y1="66" x2="742" y2="254" stroke="#242c35" stroke-width="1"/>

  <g stroke="#4a5560" stroke-width="2">
    <line x1="828" y1="160" x2="899" y2="160" marker-end="url(#arrow)"/>
    <line x1="958" y1="160" x2="1029" y2="160" marker-end="url(#arrow)"/>
    <line x1="1088" y1="160" x2="1159" y2="160" marker-end="url(#arrow)"/>
  </g>

  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <circle cx="800" cy="160" r="40" fill="#4c8bf5" opacity="0.06"/>
    <circle cx="800" cy="160" r="33" fill="#4c8bf5" opacity="0.12"/>
    <circle cx="800" cy="160" r="26" fill="#151b23" stroke="#4c8bf5" stroke-width="2.5"/>
    <text x="800" y="165" font-weight="700" fill="#4c8bf5" font-size="13">DISC</text>
    <text x="800" y="212" font-size="14" fill="#9aa4af">Discover</text>

    <circle cx="930" cy="160" r="40" fill="#d97757" opacity="0.06"/>
    <circle cx="930" cy="160" r="33" fill="#d97757" opacity="0.12"/>
    <circle cx="930" cy="160" r="26" fill="#151b23" stroke="#d97757" stroke-width="2.5"/>
    <text x="930" y="165" font-weight="700" fill="#d97757" font-size="13">ATS</text>
    <text x="930" y="212" font-size="14" fill="#9aa4af">Evaluate</text>

    <circle cx="1060" cy="160" r="40" fill="#a78bfa" opacity="0.06"/>
    <circle cx="1060" cy="160" r="33" fill="#a78bfa" opacity="0.12"/>
    <circle cx="1060" cy="160" r="26" fill="#151b23" stroke="#a78bfa" stroke-width="2.5"/>
    <text x="1060" y="165" font-weight="700" fill="#a78bfa" font-size="13">RES</text>
    <text x="1060" y="212" font-size="14" fill="#9aa4af">Tailor</text>

    <circle cx="1190" cy="160" r="40" fill="#00e599" opacity="0.06"/>
    <circle cx="1190" cy="160" r="33" fill="#00e599" opacity="0.12"/>
    <circle cx="1190" cy="160" r="26" fill="#151b23" stroke="#00e599" stroke-width="2.5"/>
    <text x="1190" y="165" font-weight="700" fill="#00e599" font-size="13">OUT</text>
    <text x="1190" y="212" font-size="14" fill="#9aa4af">Deliver</text>
  </g>

  <rect x="0" y="312" width="320" height="8" fill="#4c8bf5"/>
  <rect x="320" y="312" width="320" height="8" fill="#d97757"/>
  <rect x="640" y="312" width="320" height="8" fill="#a78bfa"/>
  <rect x="960" y="312" width="320" height="8" fill="#00e599"/>
</svg>
